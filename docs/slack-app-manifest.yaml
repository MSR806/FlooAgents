# Floo Agents mentions-only Slack app manifest. Paste at api.slack.com/apps → your app → App Manifest,
# then Reinstall to Workspace after changing scopes.
# Socket Mode = no public URL. App-level token needs `connections:write` (SLACK_APP_TOKEN);
# Bot User OAuth Token = SLACK_BOT_TOKEN.
display_information:
  name: Floo Agents
  description: Any agent. Any harness. Any channel.
  background_color: "#091c32"
features:
  bot_user:
    display_name: flooagents
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - reactions:write # ack/queued/done reactions
      - channels:history # thread context in public channels
      - groups:history # thread context in private channels
      - users:read # resolve Slack user ids in logs
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
