# Gitleaks config. Keeps every built-in rule and adds the ones this repo needs.
#
# Verified empirically: gitleaks 8.30.1 catches GitHub PATs, Slack bot/app tokens,
# private keys, and generic high-entropy assignments like GILLY_VAULT_KEY — but
# misses Anthropic and OpenAI API keys. Those are the credentials Gilly is built
# around (the Claude harness today, an OpenAI one in flight), so they get rules.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
# Covers both the project/service-account form (sk-proj-…) and the legacy sk-… form.
regex = '''sk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{20,}|sk-[A-Za-z0-9]{32,}'''
keywords = ["sk-"]
