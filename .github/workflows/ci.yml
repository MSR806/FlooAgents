name: CI

on:
  pull_request:
  push:
    branches: [master]

# A force-push shouldn't queue behind the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so runs are reproducible and the binary is cached.
          bun-version: 1.3.5

      # --frozen-lockfile fails when bun.lock is out of sync with package.json,
      # so a PR can't quietly change dependencies.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # `bun run test`, not `bun test` — the script scopes the scan to apps/ and
      # packages/ so runtime data under config/skills or data/ can't join the run.
      - run: bun run test

      # Catches what `tsc --noEmit` can't: bad imports, server/client boundary
      # violations, route-level build failures.
      - name: Build web
        run: bun run --filter '@floo/web' build

  # Separate job so it runs in parallel and keeps its deep clone out of the main
  # one. This — not the pre-commit hook — is what actually enforces the scan:
  # hooks can be skipped with --no-verify or never installed at all.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads git history, so a shallow clone would hide most of it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned for reproducibility. Dependabot can't see a curl URL — bump by hand.
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # On a PR, scan every commit in the branch — not just the head. A secret
      # added in commit 2 and removed in commit 4 still lives in the history the
      # merge would bring along.
      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --redact --no-banner \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks git --redact --no-banner
          fi
