version: 2
updates:
  # Bun version updates are GA and read the text-based bun.lock. Known sharp edge:
  # in workspace monorepos Dependabot sometimes bumps package.json without
  # updating bun.lock, which CI's --frozen-lockfile then rejects. Fix by pushing
  # a `bun install` to the Dependabot branch.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch bumps are more noise than value. This does NOT suppress security
    # updates — those run on a separate track that ignores these conditions, so a
    # vulnerable patch release still gets its own PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      # One PR for the minor bumps; majors arrive individually so each gets looked
      # at on its own.
      minor:
        patterns: ["*"]
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      actions:
        patterns: ["*"]
