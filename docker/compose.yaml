# One-command local stack: harness + control-plane + web.
# Each service loads its own app .env via env_file; compose only overrides the
# handful of values that must differ inside the Docker network (service
# hostnames, container paths). Paths here are relative to this file (docker/).
services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile.harness
    env_file:
      - ../apps/harness/.env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      WORKSPACES_DIR: /data/workspaces
      CODEX_STATE_DIR: /data/codex
    volumes:
      - agent-workspaces:/data/workspaces
      - codex-state:/data/codex

  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control-plane
    depends_on:
      - harness
      - gateway
    env_file:
      - ../apps/control-plane/.env    # CREDENTIAL_VAULT_KEY (required), WEB_PORT, ...
    environment:
      # Override .env values that only make sense on the host, not in-network.
      # (environment wins over env_file.)
      HARNESS_URL: http://harness:8080
      TOOL_GATEWAY_URL: http://gateway:4100
      AGENTS_DIR: /app/config/agents
      BUILTIN_AGENTS_DIR: /app/config/builtin-agents
      SKILLS_DIR: /app/config/skills
      DATABASE_PATH: /data/platform.db
    volumes:
      - ../config:/app/config:ro      # agent + skill JSON, read-only
      - platform-data:/data           # SQLite store persists across runs
    ports:
      - "127.0.0.1:4000:4000" # trusted management API; never publish beyond loopback

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    env_file:
      - ../apps/gateway/.env          # CREDENTIAL_VAULT_KEY and INTERNAL_API_TOKEN
    environment:
      DATABASE_PATH: /data/platform.db
      TOOL_GATEWAY_URL: http://localhost:4100
      WEB_APP_URL: http://localhost:3000
      CONTROL_PLANE_URL: http://control-plane:4000
    volumes:
      - platform-data:/data
    ports:
      - "127.0.0.1:4100:4100" # internal Tool Gateway; never publish beyond loopback

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - control-plane
    environment:
      # Next.js rewrites /api/* to the control-plane over the Docker network.
      API_URL: http://control-plane:4000
    ports:
      # The web UI is the only service whose host bind may be configured.
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"

volumes:
  platform-data:
  agent-workspaces:
  codex-state:
